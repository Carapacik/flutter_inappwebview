name: flutter_inappwebview_linux
description: "Linux implementation of flutter_inappwebview plugin using WPE WebKit."
version: 0.1.0-beta.1
homepage: https://inappwebview.dev/
repository: https://github.com/pichillilorenzo/flutter_inappwebview/tree/master/flutter_inappwebview_linux
issue_tracker: https://github.com/pichillilorenzo/flutter_inappwebview/issues
funding:
  - https://inappwebview.dev/donate/
topics:
  - html
  - webview
  - webview-flutter
  - inappwebview
  - browser

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview_platform_interface: ^1.4.0-beta.3
    # path: ../flutter_inappwebview_platform_interface

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    implements: flutter_inappwebview
    platforms:
      linux:
        pluginClass: FlutterInappwebviewLinuxPlugin
        dartPluginClass: LinuxInAppWebViewPlatform
