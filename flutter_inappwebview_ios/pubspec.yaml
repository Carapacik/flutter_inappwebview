name: flutter_inappwebview_ios
description: iOS implementation of the flutter_inappwebview plugin.
version: 1.2.0-beta.3
homepage: https://inappwebview.dev/
repository: https://github.com/pichillilorenzo/flutter_inappwebview/tree/master/flutter_inappwebview_ios
issue_tracker: https://github.com/pichillilorenzo/flutter_inappwebview/issues
funding:
  - https://inappwebview.dev/donate/
topics:
  - html
  - webview
  - webview-flutter
  - inappwebview
  - browser

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview_platform_interface: ^1.4.0-beta.3
    # path: ../flutter_inappwebview_platform_interface

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  plugin_platform_interface: ^2.1.8

flutter:
  plugin:
    implements: flutter_inappwebview
    platforms:
      ios:
        pluginClass: InAppWebViewFlutterPlugin
        dartPluginClass: IOSInAppWebViewPlatform
