name: flutter_inappwebview_ios_example
description: Demonstrates how to use the flutter_inappwebview_ios plugin.
publish_to: 'none'

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview_ios:
    path: ../
  flutter_inappwebview_platform_interface: ^1.4.0-beta.3
    # path: ../../flutter_inappwebview_platform_interface
  url_launcher: ^6.1.0
  cupertino_icons: ^1.0.2

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
